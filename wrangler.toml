# =============================================================
# wrangler.toml — Temp Mail on Cloudflare Workers
# =============================================================
name = "temone-tempmail"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Public environment variables (comma-separated list of active domains)
[vars]
DOMAIN = "trysortmail.co,ontem.fit"

# SPA Static Assets Configuration
[assets]
directory = "./public"
binding = "ASSETS"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "trysortmail"
database_id = "a6a272e1-35de-4dbd-91b5-a5b92c377002"

# Scheduled Cleanup Task (Runs daily at 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]
